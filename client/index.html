<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#3556d8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a2332" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PacPilot — 自动生成与管理 PAC 代理规则，支持自定义规则、远程列表、定时任务与 Webhook 通知。"
    />
    <meta name="application-name" content="PacPilot" />
    <meta name="apple-mobile-web-app-title" content="PacPilot" />
    <meta property="og:title" content="PacPilot" />
    <meta
      property="og:description"
      content="自动生成与管理 PAC 代理规则的轻量工具，带网页管理界面。"
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>PacPilot</title>
    <!--
      启动占位（boot shell）：这里必须写原生 CSS，不能用 Tailwind。
      它的唯一作用是让浏览器在 JS 包下载、解析、执行完成之前就有内容可绘制；
      此时 @/styles/tailwind.css 尚未加载，使用 @apply 或设计令牌都会失效。
      颜色统一用系统颜色关键字（Canvas / CanvasText），随 color-scheme 自动适配明暗，
      因此不需要硬编码主题色，也不会在深色模式下闪白。
      Vue 挂载时会清空 #app，占位随之消失。
    -->
    <style>
      /*
        启动阶段整页只有一个占位，必须去掉浏览器默认的 body 外边距（8px），
        否则文档高度会变成 100vh + 16px，右侧/底部凭空多出一根滚动条。
        padding 一并清零，避免其他 UA 样式差异。
      */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* 用 svh 跟随移动端可视高度，避免地址栏收起时 100vh 超出可视区产生滚动。 */
      #app {
        min-height: 100vh;
        min-height: 100svh;
      }
      /* Vue 挂载后占位被替换，这条规则自动失效，不影响应用自身的滚动行为。 */
      body:has(.boot) {
        overflow: hidden;
      }
      .boot {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: Canvas;
        color: CanvasText;
        font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot__mark {
        letter-spacing: 0.02em;
      }
      .boot__spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 2.5px solid transparent;
        border-top-color: currentColor;
        border-right-color: currentColor;
        border-radius: 50%;
        opacity: 0.55;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="PacPilot">
        <span class="boot__mark">PacPilot</span>
        <span class="boot__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 新功能
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug 修复
      labels:
        - bug
        - fix
    - title: 🛠️ 维护与重构
      labels:
        - maintenance
        - refactor
    - title: 📚 文档与其他
      labels:
        - documentation
        - docs
        - dependencies
    - title: 其他变更
      labels:
        - "*"

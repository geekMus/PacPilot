name: 前后端单元测试与覆盖率

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# 同一工作流、同一分支只保留最新运行；不同工作流和不同分支互不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # push / 手动触发只允许 main、dev；PR 按目标分支判断。
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')) ||
      (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    name: 前后端单测与覆盖率门槛
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v7

      - name: 阶段 1 小结：检出代码
        if: always()
        env:
          RESULT: ${{ steps.checkout.outcome }}
        run: |
          {
            echo "## 阶段 1：检出代码"
            echo
            echo "- **结果：** ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 安装 Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 阶段 2 小结：运行环境
        if: always()
        env:
          RESULT: ${{ steps.setup-bun.outcome }}
        run: |
          {
            echo "## 阶段 2：准备运行环境"
            echo
            echo "- **Bun 安装结果：** ${RESULT}"
            echo "- **版本策略：** latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 安装依赖
        id: install
        run: bun install

      - name: 阶段 3 小结：依赖安装
        if: always()
        env:
          RESULT: ${{ steps.install.outcome }}
        run: |
          {
            echo "## 阶段 3：安装依赖"
            echo
            echo "- **结果：** ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 类型检查、构建与国际化校验
        id: check
        run: bun run check

      - name: 阶段 4 小结：类型检查、构建与国际化
        if: always()
        env:
          RESULT: ${{ steps.check.outcome }}
        run: |
          {
            echo "## 阶段 4：类型检查、构建与国际化校验"
            echo
            echo "- **结果：** ${RESULT}"
            if [[ "${RESULT}" == "success" ]]; then
              echo "- **结论：** 检查通过，可以进入单元测试阶段。"
            else
              echo "- **结论：** 检查未通过或被跳过；请查看本阶段日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 运行前后端单测并检查覆盖率
        id: tests
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        shell: bash
        run: |
          set +e
          bun run test > "$RUNNER_TEMP/test-output.log" 2>&1
          TEST_STATUS=$?
          set -e

          # 成功时隐藏冗长的测试明细；失败时输出去除 ANSI 控制码的日志，便于排查。
          if [[ "$TEST_STATUS" -ne 0 ]]; then
            perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g' "$RUNNER_TEMP/test-output.log"
            exit "$TEST_STATUS"
          fi

      - name: 阶段 5 小结：单元测试
        if: always()
        env:
          RESULT: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## 阶段 5：前后端单元测试与覆盖率门槛"
            echo
            echo "- **结果：** ${RESULT}"
            if [[ "${RESULT}" == "success" ]]; then
              echo "- **结论：** 单元测试与覆盖率门槛通过。"
            else
              echo "- **结论：** 测试未通过或被跳过；请查看本阶段日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 阶段 6 小结：覆盖率报告
        if: always()
        shell: bash
        run: |
          {
            echo "## 阶段 6：覆盖率报告"
            echo
            echo "| 范围 | 语句覆盖率 | 分支覆盖率 | 函数覆盖率 | 行覆盖率 |"
            echo "|---|---:|---:|---:|---:|"
            node <<'NODE'
          const fs = require("node:fs");
          const reports = [
            ["后端", "coverage/server/coverage-summary.json"],
            ["前端", "coverage/client/coverage-summary.json"],
          ];
          let found = 0;
          for (const [label, path] of reports) {
            if (!fs.existsSync(path)) {
              console.log(`| ${label} | 未生成 | 未生成 | 未生成 | 未生成 |`);
              continue;
            }
            const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
            const pct = key => `${Number(total[key]?.pct ?? 0).toFixed(2)}%`;
            console.log(`| ${label} | ${pct("statements")} | ${pct("branches")} | ${pct("functions")} | ${pct("lines")} |`);
            found++;
          }
          if (!found) console.log("| — | 未生成 | 未生成 | 未生成 | 未生成 |");
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

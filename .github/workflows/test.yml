name: 前后端单元测试与覆盖率

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:


permissions:
  contents: read

jobs:
  test:
    # push / 手动触发只允许 main、dev；PR 按目标分支判断。
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')) ||
      (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    name: 前后端单测与覆盖率门槛
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行前后端单测并检查覆盖率
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: bun run test

      - name: 汇总测试结果与覆盖率
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## 前后端单元测试与覆盖率"
            echo
            echo "- **执行命令：** `bun run test`"
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo "- **结果：** 通过"
            else
              echo "- **结果：** 失败或被取消，请查看测试日志"
            fi
            echo
            echo "### 覆盖率汇总"
            echo
            echo "| 范围 | 语句覆盖率 | 分支覆盖率 | 函数覆盖率 | 行覆盖率 |"
            echo "|---|---:|---:|---:|---:|"
            node <<'NODE'
          const fs = require("node:fs");
          const reports = [
            ["后端", "coverage/server/coverage-summary.json"],
            ["前端", "coverage/client/coverage-summary.json"],
          ];
          let found = 0;
          for (const [label, path] of reports) {
            if (!fs.existsSync(path)) {
              console.log(`| ${label} | 未生成 | 未生成 | 未生成 | 未生成 |`);
              continue;
            }
            const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
            const pct = key => `${Number(total[key]?.pct ?? 0).toFixed(2)}%`;
            console.log(`| ${label} | ${pct("statements")} | ${pct("branches")} | ${pct("functions")} | ${pct("lines")} |`);
            found++;
          }
          if (!found) console.log("| — | 未生成 | 未生成 | 未生成 | 未生成 |");
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

name: 初始化当前版本镜像标签

on:
  # 一次性发布当前项目 2.2.0 的版本镜像，建立后续版本对比基线。
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-current-image-version.yml

permissions:
  contents: read

jobs:
  publish-baseline:
    name: 发布 2.2.0 版本基线镜像
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: 检出 2.2.0 对应源码
        uses: actions/checkout@v4
        with:
          ref: 25f6a38039eed420783159b438630391dca69d9f
          fetch-depth: 0

      - name: 验证项目版本
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' package.json)"
          if [[ "$VERSION" != "2.2.0" ]]; then
            echo "::error::基线提交中的 package.json 版本不是 2.2.0。"
            exit 1
          fi
          echo "正在发布项目版本 $VERSION。"

      - name: 启用 ARM64 构建支持
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 2.2.0 多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/geekmus/genpac-runner:2.2.0
          labels: |
            org.opencontainers.image.title=genpac-runner
            org.opencontainers.image.description=自动生成 PAC 文件的工具
            org.opencontainers.image.source=https://github.com/geekMus/genpac-runner
            org.opencontainers.image.version=2.2.0
            org.opencontainers.image.revision=25f6a38039eed420783159b438630391dca69d9f
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 2.2.0 基线 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.0 >/dev/null 2>&1; then
            echo "v2.2.0 Release 已存在，跳过重复创建。"
          else
            gh release create v2.2.0 \
              --target 25f6a38039eed420783159b438630391dca69d9f \
              --title "genpac-runner v2.2.0" \
              --generate-notes
          fi
          echo "已发布版本镜像：ghcr.io/geekmus/genpac-runner:2.2.0"

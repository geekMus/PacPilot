name: 初始化当前版本镜像标签

on:
  # 一次性基线操作：将当前已发布的 latest 绑定到 package.json 的 2.2.0。
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-current-image-version.yml

permissions:
  contents: read

jobs:
  tag-current-image:
    name: 为当前已发布镜像补充 2.2.0 版本标签
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 验证当前项目版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' package.json)"
          if [[ "$VERSION" != "2.2.0" ]]; then
            echo "::error::当前 package.json 版本已不是 2.2.0，停止一次性基线操作。"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 将现有镜像标记为项目版本
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/geekmus/genpac-runner:$VERSION" \
            ghcr.io/geekmus/genpac-runner:latest

      - name: 创建 2.2.0 基线 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION Release 已存在，跳过重复创建。"
          else
            gh release create "v$VERSION" \
              --target "25f6a38039eed420783159b438630391dca69d9f" \
              --title "genpac-runner v$VERSION" \
              --generate-notes
          fi
          echo "已将当前已发布镜像添加版本标签：ghcr.io/geekmus/genpac-runner:$VERSION"

name: 代码正确性检查

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# 全仓库只保留最新一次检查；新运行会取消此前仍在运行的检查。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decide:
    name: 第一阶段：判断是否需要检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 判断变更是否需要代码检查
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -uo pipefail

          # 手动触发时按用户意图执行完整检查。
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=手动触发，执行完整代码检查。" >> "$GITHUB_OUTPUT"
            echo "## 阶段 1：检查条件判断" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "- **判断结果：** 需要检查" >> "$GITHUB_STEP_SUMMARY"
            echo "- **原因：** 手动触发，执行完整代码检查。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            DIFF_RANGE="$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            # 新分支没有可比较的前序提交，按当前提交中的全部文件判断。
            DIFF_RANGE=""
          else
            DIFF_RANGE="$BEFORE_SHA $HEAD_SHA"
          fi

          if [[ -z "$DIFF_RANGE" ]]; then
            CHANGED_FILES="$(git ls-tree -r --name-only "$HEAD_SHA")"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! CHANGED_FILES="$(git diff --name-only "$DIFF_RANGE" 2>/dev/null)"; then
              CHANGED_FILES=""
              echo "::warning::无法计算变更文件范围，将执行检查以避免漏检。"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=无法可靠判断变更范围，按安全策略执行检查。" >> "$GITHUB_OUTPUT"
              {
                echo "## 阶段 1：检查条件判断"
                echo
                echo "- **判断结果：** 需要检查"
                echo "- **原因：** 无法可靠判断变更范围，按安全策略执行检查。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            if ! CHANGED_FILES="$(git diff --name-only $DIFF_RANGE 2>/dev/null)"; then
              echo "::warning::无法计算变更文件范围，将执行检查以避免漏检。"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=无法可靠判断变更范围，按安全策略执行检查。" >> "$GITHUB_OUTPUT"
              {
                echo "## 阶段 1：检查条件判断"
                echo
                echo "- **判断结果：** 需要检查"
                echo "- **原因：** 无法可靠判断变更范围，按安全策略执行检查。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          SHOULD_RUN=false
          RELEVANT_FILES=()
          IGNORED_FILES=()

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.md|*.mdx|docs/*|.github/*|.gitignore|LICENSE|LICENSE.*|CHANGELOG*|CONTRIBUTING*)
                IGNORED_FILES+=("$file")
                ;;
              *)
                RELEVANT_FILES+=("$file")
                SHOULD_RUN=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [[ "$SHOULD_RUN" == "true" ]]; then
            REASON="发现可能影响代码、依赖或构建的变更。"
          else
            REASON="变更仅涉及文档、许可/说明文件或 GitHub 配置，无需运行代码检查。"
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          {
            echo "## 阶段 1：检查条件判断"
            echo
            echo "- **判断结果：** $([[ "$SHOULD_RUN" == "true" ]] && echo "需要检查" || echo "跳过检查")"
            echo "- **原因：** $REASON"
            echo
            echo "### 需要检查的变更文件"
            if (("${#RELEVANT_FILES[@]}" > 0)); then
              printf -- '- `%s`\n' "${RELEVANT_FILES[@]}"
            else
              echo "- 无"
            fi
            echo
            echo "### 忽略的文档/配置变更"
            if (("${#IGNORED_FILES[@]}" > 0)); then
              printf -- '- `%s`\n' "${IGNORED_FILES[@]}"
            else
              echo "- 无"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: 第二阶段：运行 bun run check
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 检查代码
        run: bun run check

      - name: 汇总检查结果
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## 阶段 2：代码正确性检查"
            echo
            echo "- **执行命令：** `bun run check`"
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo "- **检查结果：** 通过"
            else
              echo "- **检查结果：** 失败或被取消，请查看本阶段日志"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

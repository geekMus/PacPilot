name: 代码质量检查

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

# 同一工作流、同一分支只保留最新运行；不同工作流和不同分支互不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: 代码正确性检查
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v7

      - name: 安装 Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        id: install
        run: bun install

      - name: 类型检查、构建与国际化校验
        id: check
        run: bun run check

      - name: 阶段 1 小结
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          BUN: ${{ steps.setup-bun.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CHECK: ${{ steps.check.outcome }}
        shell: bash
        run: |
          {
            echo "## 阶段 1：代码正确性检查"
            echo
            echo "- **整体结果：** ${JOB_STATUS}"
            echo "- **代码检出：** ${CHECKOUT}"
            echo "- **Bun 环境：** ${BUN}"
            echo "- **依赖安装：** ${INSTALL}"
            echo "- **类型检查、构建与国际化校验：** ${CHECK}"
            if [[ "${JOB_STATUS}" == "success" ]]; then
              echo "- **后续阶段：** 可以进入单元测试。"
            else
              echo "- **后续阶段：** 单元测试阶段不会执行；请先修复本阶段失败。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: 前后端单元测试
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v7

      - name: 安装 Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        id: install
        run: bun install

      - name: 运行前后端单测并检查覆盖率
        id: tests
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        shell: bash
        run: |
          set +e
          bun run test > "$RUNNER_TEMP/test-output.log" 2>&1
          TEST_STATUS=$?
          set -e

          if [[ "$TEST_STATUS" -ne 0 ]]; then
            perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g' "$RUNNER_TEMP/test-output.log"
            exit "$TEST_STATUS"
          fi

      - name: 保存覆盖率报告
        id: upload-coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/server/coverage-summary.json
            coverage/client/coverage-summary.json
          if-no-files-found: warn
          retention-days: 1

      - name: 阶段 2 小结
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          COVERAGE_UPLOAD: ${{ steps.upload-coverage.outcome }}
        shell: bash
        run: |
          {
            echo "## 阶段 2：前后端单元测试"
            echo
            echo "- **整体结果：** ${JOB_STATUS}"
            echo "- **单元测试：** ${TEST_RESULT}"
            echo "- **覆盖率报告保存：** ${COVERAGE_UPLOAD}"
            if [[ "${TEST_RESULT}" == "success" ]]; then
              echo "- **结论：** 单元测试命令执行成功。"
            else
              echo "- **结论：** 单元测试未通过或未执行，请查看本阶段日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: 覆盖率报告
    needs: [prepare, test]
    if: always() && needs.prepare.result == 'success' && needs.test.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 下载覆盖率报告
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage

      - name: 生成覆盖率阶段报告
        id: report
        if: always()
        shell: bash
        run: |
          {
            echo "## 阶段 3：覆盖率报告"
            echo
            echo "| 范围 | 语句覆盖率 | 分支覆盖率 | 函数覆盖率 | 行覆盖率 |"
            echo "|---|---:|---:|---:|---:|"
            node <<'NODE'
          const fs = require("node:fs");
          const reports = [
            ["后端", "coverage/server/coverage-summary.json"],
            ["前端", "coverage/client/coverage-summary.json"],
          ];
          let found = 0;
          for (const [label, path] of reports) {
            if (!fs.existsSync(path)) {
              console.log(`| ${label} | 未生成 | 未生成 | 未生成 | 未生成 |`);
              continue;
            }
            const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
            const pct = key => `${Number(total[key]?.pct ?? 0).toFixed(2)}%`;
            console.log(`| ${label} | ${pct("statements")} | ${pct("branches")} | ${pct("functions")} | ${pct("lines")} |`);
            found++;
          }
          if (!found) console.log("| — | 未生成 | 未生成 | 未生成 | 未生成 |");
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 阶段 3 小结
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DOWNLOAD_RESULT: ${{ steps.download-coverage.outcome }}
          REPORT_RESULT: ${{ steps.report.outcome }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          {
            echo
            echo "### 阶段处理结果"
            echo
            echo "- **单元测试阶段：** ${TEST_RESULT}"
            echo "- **覆盖率报告下载：** ${DOWNLOAD_RESULT}"
            echo "- **覆盖率报告生成：** ${REPORT_RESULT}"
            if [[ "${DOWNLOAD_RESULT}" != "success" ]]; then
              echo "- **说明：** 未能下载覆盖率报告；请确认测试阶段是否生成并上传报告。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: 前后端单测与覆盖率门槛
    needs: [prepare, test, coverage]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总并验证所有阶段结果
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        shell: bash
        run: |
          {
            echo "## 前后端单测与覆盖率门槛"
            echo
            echo "- **阶段 1（代码正确性检查）：** ${PREPARE_RESULT}"
            echo "- **阶段 2（前后端单元测试）：** ${TEST_RESULT}"
            echo "- **阶段 3（覆盖率报告）：** ${COVERAGE_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PREPARE_RESULT" != "success" || "$TEST_RESULT" != "success" || "$COVERAGE_RESULT" != "success" ]]; then
            echo "::error::至少一个必需阶段未成功，禁止通过前后端单测与覆盖率门槛。"
            exit 1
          fi

          echo "所有必需阶段均已成功。"

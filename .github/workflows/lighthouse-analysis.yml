name: 页面 Lighthouse 分析

on:
  workflow_dispatch:

# 同一工作流、同一 ref 只保留最新运行；不同工作流和不同 ref 互不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 项目性能目标：所有页面 Lighthouse 性能分 ≥ 85；低于阈值只作为报告结论，
  # 不判定失败。声明在工作流级别，分析步骤统一使用这个值，避免改一处漏一处。
  MIN_SCORE: "85"

jobs:
  lighthouse:
    name: 全页面 Lighthouse 分析
    # 手动入口保留，但仅允许在 dev / main 上实际执行；其他分支直接跳过。
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v7

      - name: 安装 Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        id: install
        run: bun install

      - name: 构建前端
        id: build
        run: bun run build

      - name: 安装 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: 启动 PacPilot 服务
        id: server
        env:
          # 与部署形态保持一致：分析要量的是生产 profile 的响应，
          # 而不是会自动读取仓库 .env 的 development profile。
          NODE_ENV: production
          DATA_DIR: ${{ runner.temp }}/pacpilot-data
          PORT: "17321"
          HOST: 127.0.0.1
          DEFAULT_ADMIN_PASSWORD: lighthouse-ci-password
          NO_COLOR: "1"
        run: |
          mkdir -p "$DATA_DIR"
          bun run server/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

      - name: 等待服务就绪
        id: wait-server
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:17321/api/status"; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务未能在 30 秒内就绪，启动日志如下"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: 运行 Lighthouse 分析
        id: analyze
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:17321
          ADMIN_PASSWORD: lighthouse-ci-password
          OUTPUT_DIR: lighthouse-reports
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # 空实例的页面偏快，先写入固定规则集再测量。
          SEED_RULES: "1"
        run: |
          set +e
          node scripts/lighthouse/analyze.mjs > "$RUNNER_TEMP/analyze.log" 2>&1
          ANALYZE_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/analyze.log"
          # 必须把判定结果作为步骤退出码传出去：只在日志里打印的话，
          # 步骤永远以 0 结束，后面的门槛检查就永远不会失败。
          exit "$ANALYZE_STATUS"

      - name: 保存 Lighthouse 报告
        id: upload-reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: 写入分析摘要
        id: summary
        if: always()
        run: |
          if [[ -f lighthouse-reports/summary.md ]]; then
            cat lighthouse-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 页面 Lighthouse 分析"
              echo
              echo "未能生成分析摘要（分析步骤可能未执行成功），完整日志见上方步骤输出。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 停止服务
        id: stop-server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
          fi

      - name: 结果判定
        id: gate
        env:
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          SERVER_RESULT: ${{ steps.wait-server.outcome }}
          REPORTS_UPLOAD: ${{ steps.upload-reports.outcome }}
        run: |
          {
            echo "### 阶段处理结果"
            echo
            echo "- **服务启动：** ${SERVER_RESULT}"
            echo "- **Lighthouse 分析：** ${ANALYZE_RESULT}"
            echo "- **报告保存：** ${REPORTS_UPLOAD}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SERVER_RESULT" != "success" ]]; then
            echo "::error::服务未能启动，分析未执行。"
            exit 1
          fi
          if [[ "$ANALYZE_RESULT" != "success" ]]; then
            echo "::error::分析脚本执行失败：登录失败、页面被重定向、会话失效或报告生成失败（得分低于 ${MIN_SCORE} 分仅作为报告结论，不判定失败），详见上方日志。"
            exit 1
          fi
          echo "分析已完成，报告见上方摘要与 lighthouse-reports 构建产物（得分低于 ${MIN_SCORE} 分的页面会标注在报告中，但不会使运行失败）。"

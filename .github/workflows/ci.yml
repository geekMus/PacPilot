name: 类型检查与前端构建

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: 类型检查与前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile || bun install

      - name: TypeScript 类型检查
        run: bun run typecheck

      - name: 构建前端
        run: bun run build:client

      # 仅在网络监控功能分支构建临时 ARM64 测试镜像；不推送 GHCR、不更新正式标签。
      - name: 启用 ARM64 构建支持
        if: github.ref == 'refs/heads/feature/network-monitoring-v1'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        if: github.ref == 'refs/heads/feature/network-monitoring-v1'
        uses: docker/setup-buildx-action@v4

      - name: 构建 ARM64 测试镜像
        if: github.ref == 'refs/heads/feature/network-monitoring-v1'
        run: docker buildx build --platform linux/arm64 --load --tag genpac-runner:network-monitoring-v1 .

      - name: 导出 ARM64 测试镜像
        if: github.ref == 'refs/heads/feature/network-monitoring-v1'
        run: docker save genpac-runner:network-monitoring-v1 --output /tmp/genpac-runner-network-monitoring-v1-arm64.tar

      - name: 上传短期测试产物
        if: github.ref == 'refs/heads/feature/network-monitoring-v1'
        uses: actions/upload-artifact@v4
        with:
          name: genpac-runner-network-monitoring-v1-arm64
          path: /tmp/genpac-runner-network-monitoring-v1-arm64.tar
          if-no-files-found: error
          retention-days: 7

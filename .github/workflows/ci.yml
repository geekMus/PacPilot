name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type checking and project validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: bun install

      - name: Run type checks, build, and translation validation
        id: check
        run: bun run check

      - name: Check formatting of changed files
        id: format
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$base" ]]; then
            echo "No base commit is available; skipping changed-file formatting check."
            exit 0
          fi

          mapfile -d '' files < <(git diff --name-only -z "$base" "$HEAD_SHA" -- '*.ts' '*.vue' '*.js' '*.cjs' '*.mjs' '*.json' '*.css' '*.md' '*.html' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "No supported source files changed; formatting check is not needed."
            exit 0
          fi

          printf 'Checking %s changed file(s).\n' "${#files[@]}"
          bun run prettier --check "${files[@]}"

      - name: Summarize validation results
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          CHECK_RESULT: ${{ steps.check.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Continuous integration summary"
            echo
            echo "- Dependency installation: ${INSTALL_RESULT}"
            echo "- Type checking, build, and translation validation: ${CHECK_RESULT}"
            echo "- Changed-file formatting check: ${FORMAT_RESULT}"
            echo "- Overall job status: ${JOB_STATUS}"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

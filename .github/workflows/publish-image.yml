name: 构建并发布 Docker 镜像

on:
  # 自动触发只监听 main 上的 package.json 变更；是否发布由 GHCR latest 决定。
  push:
    branches:
      - main
    paths:
      - package.json
  # 手动触发也允许发布，但仍必须通过同样的日期和 latest 版本检查。
  workflow_dispatch:

# 时区集中配置；将来需要更换发布日历时只需修改此变量。
env:
  RELEASE_TIMEZONE: Asia/Shanghai
  IMAGE_NAME: ghcr.io/geekmus/genpac-runner

# 同一分支只保留最新一次运行；新运行到来时取消旧任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: 判断镜像发布条件
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      publish: ${{ steps.version.outputs.publish }}
      reason: ${{ steps.version.outputs.reason }}
    steps:
      - name: 检出当前提交
        uses: actions/checkout@v7

      - name: 检查当天版本并比较 GHCR latest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          VERSION="$(jq -er '.version' package.json)"
          if [[ ! "$VERSION" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-[rR]([1-9][0-9]*))?$ ]]; then
            echo "::error::package.json.version 必须使用 YYYY.MM.DD 或 YYYY.MM.DD-rN 格式。"
            exit 1
          fi

          VERSION_DATE="${VERSION%%-[rR]*}"
          YEAR="${VERSION_DATE%%.*}"
          REST="${VERSION_DATE#*.}"
          MONTH="${REST%%.*}"
          DAY="${REST##*.}"
          NORMALIZED_DATE="$(date -u -d "${YEAR}-${MONTH}-${DAY}" +%Y.%m.%d 2>/dev/null || true)"
          if [[ "$NORMALIZED_DATE" != "$VERSION_DATE" ]]; then
            echo "::error::版本日期无效：$VERSION_DATE"
            exit 1
          fi

          TODAY="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          if [[ "$VERSION_DATE" != "$TODAY" ]]; then
            echo "::error::版本日期必须恰好等于 $RELEASE_TIMEZONE 当天：今天是 $TODAY，package.json.version 为 $VERSION。过去或未来日期均不允许发布。"
            exit 1
          fi

          REGISTRY_TOKEN="$(curl -fsSL 'https://ghcr.io/token?scope=repository:geekmus/genpac-runner:pull&service=ghcr.io' | jq -er '.token // .access_token')"
          MANIFEST_ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          MANIFEST_STATUS="$(curl -sS -o "$RUNNER_TEMP/latest-manifest.json" -w '%{http_code}' \
            -H "Authorization: Bearer $REGISTRY_TOKEN" \
            -H "Accept: $MANIFEST_ACCEPT" \
            'https://ghcr.io/v2/geekmus/genpac-runner/manifests/latest')"

          PREVIOUS_VERSION=""
          if [[ "$MANIFEST_STATUS" == "200" ]]; then
            if jq -e '.manifests | type == "array"' "$RUNNER_TEMP/latest-manifest.json" >/dev/null; then
              ARM64_DIGEST="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")][0].digest' "$RUNNER_TEMP/latest-manifest.json")"
              curl -fsSL -H "Authorization: Bearer $REGISTRY_TOKEN" -H "Accept: $MANIFEST_ACCEPT" \
                "https://ghcr.io/v2/geekmus/genpac-runner/manifests/$ARM64_DIGEST" \
                -o "$RUNNER_TEMP/latest-platform-manifest.json"
            elif jq -e '.config.digest' "$RUNNER_TEMP/latest-manifest.json" >/dev/null; then
              cp "$RUNNER_TEMP/latest-manifest.json" "$RUNNER_TEMP/latest-platform-manifest.json"
            else
              echo "::error::GHCR latest 标签返回无法识别的镜像清单。"
              exit 1
            fi

            CONFIG_DIGEST="$(jq -er '.config.digest' "$RUNNER_TEMP/latest-platform-manifest.json")"
            curl -fsSL -H "Authorization: Bearer $REGISTRY_TOKEN" \
              "https://ghcr.io/v2/geekmus/genpac-runner/blobs/$CONFIG_DIGEST" \
              -o "$RUNNER_TEMP/latest-config.json"
            PREVIOUS_VERSION="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' "$RUNNER_TEMP/latest-config.json")"
            if [[ -z "$PREVIOUS_VERSION" ]]; then
              echo "::error::GHCR latest 镜像缺少 org.opencontainers.image.version 标签，无法安全判断发布条件。"
              exit 1
            fi
          elif [[ "$MANIFEST_STATUS" != "404" ]]; then
            echo "::error::读取 GHCR latest 失败，HTTP 状态码：$MANIFEST_STATUS"
            exit 1
          fi

          PUBLISH="true"
          REASON="GHCR 尚无 latest 镜像，允许首次发布 $VERSION。"
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            if [[ "$VERSION" == "$PREVIOUS_VERSION" ]]; then
              PUBLISH="false"
              REASON="当前版本与 GHCR latest 相同，跳过重复发布。"
            elif [[ "$PREVIOUS_VERSION" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-[rR]([1-9][0-9]*))?$ ]]; then
              PREVIOUS_DATE="${PREVIOUS_VERSION%%-[rR]*}"
              if [[ "$PREVIOUS_DATE" > "$VERSION_DATE" ]]; then
                echo "::error::拒绝覆盖更新的 latest：GHCR 版本 $PREVIOUS_VERSION 晚于本次版本日期 $VERSION。"
                exit 1
              fi
              if [[ "$PREVIOUS_DATE" == "$VERSION_DATE" ]]; then
                CURRENT_REVISION="0"
                PREVIOUS_REVISION="0"
                [[ "$VERSION" == *-[rR]* ]] && CURRENT_REVISION="${VERSION##*-[rR]}"
                [[ "$PREVIOUS_VERSION" == *-[rR]* ]] && PREVIOUS_REVISION="${PREVIOUS_VERSION##*-[rR]}"
                if (( 10#$CURRENT_REVISION <= 10#$PREVIOUS_REVISION )); then
                  echo "::error::同一天的修订序号必须高于 GHCR latest：上一版本 $PREVIOUS_VERSION，本次版本 $VERSION。"
                  exit 1
                fi
              fi
              REASON="版本从 GHCR latest 的 $PREVIOUS_VERSION 更新为 $VERSION，允许发布。"
            else
              REASON="GHCR latest 使用旧版本格式 $PREVIOUS_VERSION；允许迁移到当天日历版本 $VERSION。"
            fi
          fi

          {
            echo "version=$VERSION"
            echo "previous_version=$PREVIOUS_VERSION"
            echo "publish=$PUBLISH"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          echo "发布时区：$RELEASE_TIMEZONE"
          echo "当前日期：$TODAY"
          echo "项目版本：$VERSION"
          echo "GHCR latest 版本：${PREVIOUS_VERSION:-（尚无 latest 镜像）}"
          echo "发布判断：$REASON"

      - name: 汇总发布条件检查
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          REASON: ${{ steps.version.outputs.reason }}
        shell: bash
        run: |
          {
            echo "## 阶段 1：发布条件检查"
            echo
            echo "- **当前版本：** ${VERSION:-未能读取}"
            echo "- **GHCR latest：** ${PREVIOUS_VERSION:-尚无镜像或未能读取}"
            if [[ "$PUBLISH" == "true" ]]; then
              echo "- **发布决策：** 允许进入后续检查与发布阶段"
            elif [[ "$PUBLISH" == "false" ]]; then
              echo "- **发布决策：** 跳过重复发布"
            else
              echo "- **发布决策：** 未能完成判断，请查看上方日志"
            fi
            echo "- **说明：** ${REASON:-阶段未产生判断结果，详见日志}"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: 类型检查与构建
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 完整项目检查
        run: bun run check

      - name: 汇总类型检查与构建
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "## 阶段 2：类型检查与构建"
            echo
            echo "- **目标版本：** ${VERSION:-未能读取}"
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo "- **检查结果：** `bun run check` 已通过，可以进入镜像发布阶段"
            else
              echo "- **检查结果：** 未通过或被中断，请查看本阶段日志；镜像发布不会继续"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 构建并发布 ARM64 镜像
    needs: [prepare, check]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源代码
        uses: actions/checkout@v7

      - name: 启用 ARM64 构建支持
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成版本标签和 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=genpac-runner
            org.opencontainers.image.description=带 Web 管理后台的 PAC 生成与管理服务
            org.opencontainers.image.source=https://github.com/geekMus/genpac-runner
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并发布 linux/arm64 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 汇总 ARM64 镜像发布
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "## 阶段 3：构建并发布 ARM64 镜像"
            echo
            echo "- **架构：** linux/arm64"
            echo "- **版本标签：** ${IMAGE_NAME}:${VERSION:-未知版本}"
            echo "- **latest 标签：** ${IMAGE_NAME}:latest"
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo "- **发布结果：** 镜像已推送至 GHCR"
            else
              echo "- **发布结果：** 发布未成功或被中断，请查看本阶段日志"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

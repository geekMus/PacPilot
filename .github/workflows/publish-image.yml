name: 构建并发布 Docker 镜像

on:
  push:
    branches:
      - refactor/modular-sqlite-admin
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - "package.json"
      - "bunfig.toml"
      - "server/**"
      - "client/**"
      - "scripts/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: 构建并发布多架构镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 启用 ARM64 构建支持
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/geekmus/genpac-runner
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: 显示即将构建的平台
        run: |
          echo "开始构建 genpac-runner 多架构镜像。"
          echo "支持平台：linux/amd64（x86_64，64 位 Intel/AMD）和 linux/arm64（64 位 ARM）。"
          echo "构建会在完成后推送至 ghcr.io/geekmus/genpac-runner。"

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出发布完成提示
        run: |
          echo "genpac-runner 多架构镜像构建与推送步骤已成功完成。"
          echo "镜像地址：ghcr.io/geekmus/genpac-runner:latest"

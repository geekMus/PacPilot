name: 构建并发布 Docker 镜像

on:
  # 仅 main 分支修改 package.json 时检查版本；只有版本变化才会发布镜像。
  push:
    branches:
      - main
    paths:
      - package.json
  # 其他分支只能手动触发；手动运行仅验证构建，绝不推送镜像。
  workflow_dispatch:

# 同一分支只保留最新一次运行；新提交到来时取消旧的构建/发布任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: 检查版本并构建 ARM64 镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出完整提交历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 验证日历版本并判断发布条件
        id: version
        env:
          # push 事件的 before 是本次整批提交前的 main HEAD。
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          # CalVer 格式：YYYY.MM.DD；同一天需要多次发布时使用 YYYY.MM.DD-r1、-r2。
          is_calendar_version() {
            local value="$1" base year month day normalized
            [[ "$value" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-r([1-9][0-9]*))?$ ]] || return 1
            base="${value%%-r*}"
            IFS=. read -r year month day <<< "$base"
            normalized="$(date -u -d "${year}-${month}-${day}" +%Y.%m.%d 2>/dev/null || true)"
            [[ "$normalized" == "$base" ]]
          }

          VERSION="$(jq -r '.version // empty' package.json)"
          if ! is_calendar_version "$VERSION"; then
            echo "::error::package.json.version 必须使用日历版本 YYYY.MM.DD；同日修订可使用 YYYY.MM.DD-r1。"
            exit 1
          fi

          PREVIOUS_VERSION=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            PREVIOUS_VERSION="$(git show "$PUSH_BEFORE_SHA:package.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
          fi
          VERSION_TAG="v$VERSION"
          PUBLISH="false"
          PUBLISH_LATEST="false"
          REASON="手动触发：只验证构建，不推送镜像。"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ "$VERSION" == "$PREVIOUS_VERSION" ]]; then
              REASON="package.json.version 没有变化，跳过镜像发布。"
            elif is_calendar_version "$PREVIOUS_VERSION"; then
              CURRENT_DATE="${VERSION%%-r*}"
              PREVIOUS_DATE="${PREVIOUS_VERSION%%-r*}"
              CURRENT_REVISION="0"
              PREVIOUS_REVISION="0"
              [[ "$VERSION" == *-r* ]] && CURRENT_REVISION="${VERSION##*-r}"
              [[ "$PREVIOUS_VERSION" == *-r* ]] && PREVIOUS_REVISION="${PREVIOUS_VERSION##*-r}"

              if [[ "$CURRENT_DATE" < "$PREVIOUS_DATE" ]]; then
                echo "::error::日历版本不能倒退：上一版本为 $PREVIOUS_VERSION，本次为 $VERSION。"
                exit 1
              elif [[ "$CURRENT_DATE" == "$PREVIOUS_DATE" ]] && (( 10#$CURRENT_REVISION <= 10#$PREVIOUS_REVISION )); then
                echo "::error::同一天的修订序号必须递增：上一版本为 $PREVIOUS_VERSION，本次为 $VERSION。"
                exit 1
              fi

              PUBLISH="true"
              PUBLISH_LATEST="true"
              REASON="日历版本从 $PREVIOUS_VERSION 更新为 $VERSION，发布新镜像。"
            else
              # 兼容迁移：旧版本（例如 2.2.0）不属于 CalVer 时，允许一次性切换到日期版本。
              PUBLISH="true"
              PUBLISH_LATEST="true"
              REASON="检测到旧版本格式 ${PREVIOUS_VERSION:-（无版本）}，允许首次迁移到日历版本 $VERSION。"
            fi

            if [[ "$PUBLISH" == "true" ]] && git rev-parse -q --verify "refs/tags/$VERSION_TAG" >/dev/null; then
              echo "::error::Git 标签 $VERSION_TAG 已存在，禁止重复发布相同版本。"
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "version_tag=$VERSION_TAG"
            echo "previous_version=$PREVIOUS_VERSION"
            echo "publish=$PUBLISH"
            echo "publish_latest=$PUBLISH_LATEST"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          echo "项目版本：$VERSION"
          echo "发布判断：$REASON"

      - name: 启用 ARM64 构建支持
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub 容器镜像仓库
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成版本化镜像标签和 OCI 元数据
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/geekmus/genpac-runner
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.publish == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=genpac-runner
            org.opencontainers.image.description=自动生成 PAC 文件的工具
            org.opencontainers.image.source=https://github.com/geekMus/genpac-runner
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 生成版本和提交变更摘要
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          PUBLISH_LATEST: ${{ steps.version.outputs.publish_latest }}
          REASON: ${{ steps.version.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          PREVIOUS_VERSION_SHA=""

          # 找到历史中“将 package.json 更新为上一版本”的 main 第一父提交，
          # 以此为变更摘要基线；旧版 2.2.0 也能作为第一次日期版本的基线。
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            while IFS= read -r candidate; do
              candidate_version="$(git show "$candidate:package.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
              [[ "$candidate_version" == "$PREVIOUS_VERSION" ]] || continue
              parent_version="$(git show "$candidate^:package.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
              if [[ "$parent_version" != "$PREVIOUS_VERSION" ]]; then
                PREVIOUS_VERSION_SHA="$candidate"
                break
              fi
            done < <(git log --first-parent --format='%H' "${GITHUB_SHA}^" -- package.json)
          fi

          {
            printf '# genpac-runner 镜像构建摘要\n\n'
            printf -- '- 项目版本：%s\n' "$VERSION"
            printf -- '- 本次提交：[%s](https://github.com/%s/commit/%s)\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- 构建平台：linux/arm64\n'
            printf -- '- 发布判断：%s\n' "$REASON"
            if [[ "$PUBLISH" == "true" ]]; then
              printf -- '- 版本镜像：ghcr.io/geekmus/genpac-runner:%s\n' "$VERSION"
              printf -- '- 稳定版别名：ghcr.io/geekmus/genpac-runner:latest\n'
            else
              printf '\n本次只执行构建验证，不会推送镜像。\n'
            fi
          } >> "$SUMMARY"

          if [[ -n "$PREVIOUS_VERSION_SHA" ]]; then
            {
              printf '\n## 相比上一版本的代码变更\n\n'
              printf -- '- 上一版本：%s\n' "$PREVIOUS_VERSION"
              printf -- '- 上一版本提交：[%s](https://github.com/%s/commit/%s)\n' "$PREVIOUS_VERSION_SHA" "$GITHUB_REPOSITORY" "$PREVIOUS_VERSION_SHA"
              printf -- '- 完整差异：[查看提交和文件变更](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$PREVIOUS_VERSION_SHA" "$GITHUB_SHA"
              printf '\n### 提交记录（main 第一父历史）\n\n'
            } >> "$SUMMARY"
            git log --first-parent --no-decorate --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "$PREVIOUS_VERSION_SHA..$GITHUB_SHA" >> "$SUMMARY"
          else
            {
              printf '\n## 提交记录\n\n'
              printf '未找到上一版本提交，以下列出最近的提交。\n\n'
            } >> "$SUMMARY"
            git log -10 --first-parent --no-decorate --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "$GITHUB_SHA" >> "$SUMMARY"
          fi

      - name: 构建并按条件推送 ARM64 镜像
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.version.outputs.publish == 'true' }}
          platforms: linux/arm64
          # 关闭 BuildKit 自动生成的 provenance / SBOM 附属清单，避免 GHCR 出现无标签的关联镜像版本。
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出构建结果
        env:
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            echo "ARM64 镜像已发布：ghcr.io/geekmus/genpac-runner:$VERSION"
          else
            echo "本次仅完成构建验证，未发布镜像。"
          fi

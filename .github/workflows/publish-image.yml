name: 构建并发布 Docker 镜像

on:
  # 自动触发只监听 main 上的 package.json 变更；是否发布由 GHCR latest 决定。
  push:
    branches:
      - main
    paths:
      - package.json
  # 手动触发也允许发布，但仍必须通过同样的日期和 latest 版本检查。
  workflow_dispatch:

# 时区集中配置；将来需要更换发布日历时只需修改此变量。
env:
  RELEASE_TIMEZONE: Asia/Shanghai
  IMAGE_NAME: ghcr.io/geekmus/pacpilot

# 同一分支只保留最新一次运行；新运行到来时取消旧任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: 判断镜像发布条件
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      publish: ${{ steps.version.outputs.publish }}
      reason: ${{ steps.version.outputs.reason }}
    steps:
      - name: 检出当前提交
        uses: actions/checkout@v7

      - name: 检查当天版本并比较 GHCR latest
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          VERSION="$(jq -er '.version' package.json)"
          if [[ ! "$VERSION" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-[rR]([1-9][0-9]*))?$ ]]; then
            echo "::error::package.json.version 必须使用 YYYY.MM.DD 或 YYYY.MM.DD-rN 格式。"
            exit 1
          fi

          VERSION_DATE="${VERSION%%-[rR]*}"
          YEAR="${VERSION_DATE%%.*}"
          REST="${VERSION_DATE#*.}"
          MONTH="${REST%%.*}"
          DAY="${REST##*.}"
          NORMALIZED_DATE="$(date -u -d "${YEAR}-${MONTH}-${DAY}" +%Y.%m.%d 2>/dev/null || true)"
          if [[ "$NORMALIZED_DATE" != "$VERSION_DATE" ]]; then
            echo "::error::版本日期无效：$VERSION_DATE"
            exit 1
          fi

          TODAY="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          if [[ "$VERSION_DATE" != "$TODAY" ]]; then
            echo "::error::版本日期必须恰好等于 $RELEASE_TIMEZONE 当天：今天是 $TODAY，package.json.version 为 $VERSION。过去或未来日期均不允许发布。"
            exit 1
          fi

          PREVIOUS_VERSION=""
          TOKEN_HTTP_STATUS=""
          if ! TOKEN_HTTP_STATUS="$(curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -sS \
            -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            -o "$RUNNER_TEMP/ghcr-token-response.json" -w '%{http_code}' \
            'https://ghcr.io/token?scope=repository:geekmus/pacpilot:pull&service=ghcr.io')"; then
            echo "::error::访问 GHCR token endpoint 失败；请检查网络连接。"
            exit 1
          fi

          if [[ "$TOKEN_HTTP_STATUS" == "200" ]]; then
            REGISTRY_TOKEN="$(jq -r '.token // .access_token // empty' "$RUNNER_TEMP/ghcr-token-response.json")"
            if [[ -z "$REGISTRY_TOKEN" ]]; then
              echo "::error::GHCR token endpoint 返回成功，但没有有效的 token。"
              exit 1
            fi

            MANIFEST_ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
            if ! MANIFEST_STATUS="$(curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -sS \
              -o "$RUNNER_TEMP/latest-manifest.json" -w '%{http_code}' \
              -H "Authorization: Bearer $REGISTRY_TOKEN" \
              -H "Accept: $MANIFEST_ACCEPT" \
              'https://ghcr.io/v2/geekmus/pacpilot/manifests/latest')"; then
              echo "::error::请求 GHCR latest 清单时网络连接失败。"
              exit 1
            fi
            echo "GHCR latest manifest HTTP 状态码：$MANIFEST_STATUS"

            if [[ "$MANIFEST_STATUS" == "200" ]]; then
              if jq -e '.manifests | type == "array"' "$RUNNER_TEMP/latest-manifest.json" >/dev/null; then
                ARM64_DIGEST="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")][0].digest' "$RUNNER_TEMP/latest-manifest.json")"
                curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -fsSL \
                  -H "Authorization: Bearer $REGISTRY_TOKEN" -H "Accept: $MANIFEST_ACCEPT" \
                  "https://ghcr.io/v2/geekmus/pacpilot/manifests/$ARM64_DIGEST" \
                  -o "$RUNNER_TEMP/latest-platform-manifest.json"
              elif jq -e '.config.digest' "$RUNNER_TEMP/latest-manifest.json" >/dev/null; then
                cp "$RUNNER_TEMP/latest-manifest.json" "$RUNNER_TEMP/latest-platform-manifest.json"
              else
                echo "::error::GHCR latest 标签返回无法识别的镜像清单。"
                exit 1
              fi

              CONFIG_DIGEST="$(jq -er '.config.digest' "$RUNNER_TEMP/latest-platform-manifest.json")"
              curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -fsSL \
                -H "Authorization: Bearer $REGISTRY_TOKEN" \
                "https://ghcr.io/v2/geekmus/pacpilot/blobs/$CONFIG_DIGEST" \
                -o "$RUNNER_TEMP/latest-config.json"
              PREVIOUS_VERSION="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' "$RUNNER_TEMP/latest-config.json")"
              if [[ -z "$PREVIOUS_VERSION" ]]; then
                echo "::error::GHCR latest 镜像缺少 org.opencontainers.image.version 标签，无法安全判断发布条件。"
                exit 1
              fi
            elif [[ "$MANIFEST_STATUS" != "404" ]]; then
              echo "::error::读取 GHCR latest 失败，HTTP 状态码：$MANIFEST_STATUS"
              exit 1
            fi
          elif [[ "$TOKEN_HTTP_STATUS" == "403" ]]; then
            # GHCR 在容器包尚未创建时，pull token 请求通常返回 403，而不是 404。
            # 仅当 GitHub Packages API 也返回 404 时，才按首次发布处理。
            if ! PACKAGE_HTTP_STATUS="$(curl --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 30 -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$RUNNER_TEMP/package-metadata.json" -w '%{http_code}' \
              'https://api.github.com/users/geekMus/packages/container/pacpilot')"; then
              echo "::error::GHCR 拒绝读取令牌，且查询 GitHub Packages 状态时网络连接失败。"
              exit 1
            fi
            echo "GitHub Packages metadata HTTP 状态码：$PACKAGE_HTTP_STATUS"
            if [[ "$PACKAGE_HTTP_STATUS" == "404" ]]; then
              echo "GHCR 尚无可见的 pacpilot 容器包，允许首次发布 $VERSION。"
            else
              echo "::error::GHCR 拒绝读取令牌（HTTP 403），但 GitHub Packages API 状态为 $PACKAGE_HTTP_STATUS；请检查包的可见性以及 Actions 对该包的访问权限。"
              exit 1
            fi
          else
            echo "::error::获取 GHCR 读取令牌失败，HTTP 状态码：$TOKEN_HTTP_STATUS"
            exit 1
          fi

          PUBLISH="true"
          REASON="GHCR 尚无 latest 镜像，允许首次发布 $VERSION。"
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            if [[ "$VERSION" == "$PREVIOUS_VERSION" ]]; then
              PUBLISH="false"
              REASON="当前版本与 GHCR latest 相同，跳过重复发布。"
            elif [[ "$PREVIOUS_VERSION" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-[rR]([1-9][0-9]*))?$ ]]; then
              PREVIOUS_DATE="${PREVIOUS_VERSION%%-[rR]*}"
              if [[ "$PREVIOUS_DATE" > "$VERSION_DATE" ]]; then
                echo "::error::拒绝覆盖更新的 latest：GHCR 版本 $PREVIOUS_VERSION 晚于本次版本日期 $VERSION。"
                exit 1
              fi
              if [[ "$PREVIOUS_DATE" == "$VERSION_DATE" ]]; then
                CURRENT_REVISION="0"
                PREVIOUS_REVISION="0"
                [[ "$VERSION" == *-[rR]* ]] && CURRENT_REVISION="${VERSION##*-[rR]}"
                [[ "$PREVIOUS_VERSION" == *-[rR]* ]] && PREVIOUS_REVISION="${PREVIOUS_VERSION##*-[rR]}"
                if (( 10#$CURRENT_REVISION <= 10#$PREVIOUS_REVISION )); then
                  echo "::error::同一天的修订序号必须高于 GHCR latest：上一版本 $PREVIOUS_VERSION，本次版本 $VERSION。"
                  exit 1
                fi
              fi
              REASON="版本从 GHCR latest 的 $PREVIOUS_VERSION 更新为 $VERSION，允许发布。"
            else
              REASON="GHCR latest 使用旧版本格式 $PREVIOUS_VERSION；允许迁移到当天日历版本 $VERSION。"
            fi
          fi

          {
            echo "version=$VERSION"
            echo "previous_version=$PREVIOUS_VERSION"
            echo "publish=$PUBLISH"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          echo "发布时区：$RELEASE_TIMEZONE"
          echo "当前日期：$TODAY"
          echo "项目版本：$VERSION"
          echo "GHCR latest 版本：${PREVIOUS_VERSION:-（尚无 latest 镜像）}"
          echo "发布判断：$REASON"

      - name: 汇总发布条件检查
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          REASON: ${{ steps.version.outputs.reason }}
        shell: bash
        run: |
          {
            echo "## 阶段 1：发布条件检查"
            echo
            echo "- **当前版本：** ${VERSION:-未能读取}"
            echo "- **GHCR latest：** ${PREVIOUS_VERSION:-尚无镜像或未能读取}"
            if [[ "$PUBLISH" == "true" ]]; then
              echo "- **发布决策：** 允许进入后续检查与发布阶段"
            elif [[ "$PUBLISH" == "false" ]]; then
              echo "- **发布决策：** 跳过重复发布"
            else
              echo "- **发布决策：** 未能完成判断，请查看上方日志"
            fi
            echo "- **说明：** ${REASON:-阶段未产生判断结果，详见日志}"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: 类型检查与构建
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: 安装依赖
        run: bun install

      - name: 完整项目检查
        run: bun run check

      - name: 汇总类型检查与构建
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "## 阶段 2：类型检查与构建"
            echo
            echo "- **目标版本：** ${VERSION:-未能读取}"
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo '- **检查结果：** `bun run check` 已通过，可以进入镜像发布阶段'
            else
              echo "- **检查结果：** 未通过或被中断，请查看本阶段日志；镜像发布不会继续"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 构建并发布 ARM64 镜像
    needs: [prepare, check]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源代码
        uses: actions/checkout@v7

      - name: 启用 ARM64 构建支持
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成版本标签和 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=PacPilot
            org.opencontainers.image.description=PacPilot 是一款带 Web 管理后台的 PAC 规则生成与管理服务，支持自定义规则、远程域名列表、定时更新及 Webhook 通知
            org.opencontainers.image.source=https://github.com/geekMus/PacPilot
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并发布 linux/arm64 镜像
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GHCR 包页面读取镜像 manifest 的 OCI annotation；仅设置 config labels 不足以保证页面显示简介。
          annotations: |
            manifest:org.opencontainers.image.description=PacPilot 是一款带 Web 管理后台的 PAC 规则生成与管理服务，支持自定义规则、远程域名列表、定时更新及 Webhook 通知
            manifest:org.opencontainers.image.source=https://github.com/geekMus/PacPilot
            manifest:org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
      - name: 汇总 ARM64 镜像发布
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build_image.outcome }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "## 阶段 3：构建并发布 ARM64 镜像"
            echo
            echo "- **架构：** linux/arm64"
            echo "- **版本标签：** ${IMAGE_NAME}:${VERSION:-未知版本}"
            echo "- **latest 标签：** ${IMAGE_NAME}:latest"
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo "- **发布结果：** 镜像已成功推送至 GHCR"
            else
              echo "- **发布结果：** 未成功发布（工作阶段状态：${JOB_STATUS}）"
              echo "- **构建步骤：** ${BUILD_OUTCOME:-未执行}"
              echo "- **排查建议：** 打开“构建并发布 linux/arm64 镜像”步骤日志，查看首个错误；本次不应视为已更新 latest"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

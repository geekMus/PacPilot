name: 主从检查

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-inclusion-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  main-inclusion:
    name: 主分支包含性检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出当前分支
        uses: actions/checkout@v7
        with:
          # 对外部 Fork PR，检出贡献者仓库中的源提交。
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 获取主仓库最新 main
        env:
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          git remote add upstream "https://github.com/${BASE_REPOSITORY}.git"
          git fetch upstream main:refs/remotes/upstream/main

      - name: 确认当前分支已包含主分支
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "当前分支已包含主仓库 main 的全部提交。"
          else
            echo "::error::当前分支尚未包含主仓库 main 的最新提交。请先将 main 合并或 rebase 到当前分支，再重新提交。"
            exit 1
          fi

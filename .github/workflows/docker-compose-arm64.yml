name: Docker Compose ARM64 build and smoke test

on:
  push:
    branches:
      - refactor/modular-sqlite-admin
  pull_request:
    branches:
      - refactor/modular-sqlite-admin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the ARM64 service
        run: |
          cat > /tmp/docker-compose.arm64.yml <<'YAML'
          services:
            genpac:
              platform: linux/arm64
          YAML
          docker compose -f docker-compose.yml -f /tmp/docker-compose.arm64.yml up -d --build

      - name: Smoke-test the running service
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f /tmp/docker-compose.arm64.yml exec -T genpac bun -e 'const response = await fetch("http://127.0.0.1:17321/"); if (!response.ok) process.exit(1); await response.body?.cancel();'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f /tmp/docker-compose.arm64.yml logs genpac
          exit 1

      - name: Show container logs
        if: always()
        run: docker compose -f docker-compose.yml -f /tmp/docker-compose.arm64.yml logs genpac || true

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f /tmp/docker-compose.arm64.yml down -v || true

services:
  genpac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genpac-runner
    restart: unless-stopped

    environment:
      # 管理密码和可选的会话密钥属于敏感配置，由宿主机环境变量注入。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the process environment before starting}"
      SESSION_SECRET: "${SESSION_SECRET:-}"

    # 默认使用 bridge 驱动的 Compose 项目网络，但不向宿主机发布端口。
    # 如需直接从宿主机 / 局域网访问，才取消下面两行的注释。
    # ports:
    #   - "17321:17321"

    # 容器数据固定保存在 /data。建议明确启用一种持久化挂载。
    # 方式 A：Docker 管理的命名卷
    # volumes:
    #   - genpac-data:/data

    # 方式 B：挂载到项目目录下的 ./data（请确保目录有读写权限；启用时不要同时启用方式 A）
    # volumes:
    #   - ./data:/data

# 仅在选择方式 A（命名卷）时，取消下面两行注释
# volumes:
#   genpac-data:

# 明确使用用户自定义 bridge 网络。此设置不等同于发布宿主机端口。
networks:
  default:
    driver: bridge

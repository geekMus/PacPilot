services:
  genpac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genpac-runner
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      PORT: "17321"
      HOST: "0.0.0.0"
      RUNNING_IN_DOCKER: "1"
      # 设置后启用 Vue 后台 /admin
      ADMIN_PASSWORD: "change-me"
      # SESSION_SECRET: "random-long-string"

    ports:
      - "17321:17321"

    volumes:
      - genpac-data:/data

volumes:
  genpac-data:

services:
  genpac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genpac-runner
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      PORT: "17321"
      HOST: "0.0.0.0"
      RUNNING_IN_DOCKER: "1"
      # 从启动 Docker Compose 的 shell / 部署平台读取，不要求项目目录提供 .env
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the process environment before starting}"
      SESSION_SECRET: "${SESSION_SECRET:-}"

    ports:
      - "${HOST_PORT:-17321}:17321"

    volumes:
      - genpac-data:/data

volumes:
  genpac-data:

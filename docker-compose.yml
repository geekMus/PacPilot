services:
  genpac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genpac-runner
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      PORT: "8080"
      # 设置后启用 Vue 后台 /admin；不设置则后台不可用
      ADMIN_PASSWORD: "change-me"
      # SESSION_SECRET: "random-long-string"

    ports:
      - "1200:8080"

    volumes:
      - genpac-data:/data

volumes:
  genpac-data:
